# Where every scan of every title lives, and how to tell issues apart.
# Used by pipeline/sources.py (best scan per issue, for the site) and pipeline/archive.py
# (the personal archive). Paths are relative to the repo root.
#
#   name      archive and file name
#   lang      OCR language for the archive's text layer (tur / eng)
#   site      false for titles that are only in the personal archive (English titles)
#   roots     folders searched recursively (PDF, CBR/CBZ, ZIP/RAR of images, DjVu, JPG folders)
#   number    regexes tried in order on each path part, last part first; group 1 = issue number
#   exclude   paths that belong to another title
#   supplements  name: regex — scans of an insert, appended to their issue
#   dates     first: [year, month] of issue `first_number` (default 1), monthly with no gaps;
#             or an explicit {issue: "YYYY-MM"} map; or from_name: true to read "mon_year" names
#   key       date: issues have no numbers, the date is the key (CU Amiga, Amiga Format, ...)
#   numbers   {file stem: issue number} when names carry no running number (Matematik Dünyası)
#   spreads   true when each image is a two-page spread: split into pages; the first spread
#             (back cover | front cover) gives the first and the last page
#   extras    regex for files kept unchanged next to the issue (disk images)
#   remakes   regex for PDFs that are OCR re-typesettings, not scans: used only when no real
#             scan of the issue exists, otherwise kept next to the scan as an extra
#   turn_odd  regex for image archives whose odd pages are stored upside down (both sides of each
#             sheet scanned without turning it over): those pages go into the PDF turned
#   inserts   {issue: [{after: N, from: archive, pages: [n, ...]}]}: pages the chosen copy lacks,
#             taken from another copy and put in after its page N

commodore-haberler:
  name: Commodore Haberler
  lang: tur
  roots: [data/sources/commodore-haberler, "data/sources/nas/Commodore/Program Dokum Ekleri"]
  number: ['(?i)commodore[-_ ]haberler(?:[-_ ]dergisi[-_]sayi_)?[ _-]*0*(\d+)']
  dates: {5: "1985-10", 7: "1986-01", 8: "1986-03"}

commodore:
  name: Commodore
  lang: tur
  # Commodore PDE.rar (Downloads, Oct 2026): the Program Döküm Eki of every issue 1–78.
  roots: [data/sources/commodore/Commodore, data/sources/nas/Commodore, "data/sources/commodore-pde/Commodore PDE"]
  number:
    - '(?i)^commodore pde - 0*(\d+)'
    - '(?i)^(?:commodore|c-64)[ _-]*(?:say[ıi])?[ _-]*0*(\d+)'
    - '(?i)^pde[ _-]*0*(\d+)'
    - '^0*(\d+)_pde'
  exclude: '(?i)haberler'
  supplements: {pde: '(?i)pde', ek: '(?i)-ek\.'}
  dates: {first: [1986, 3]}

64ler:
  name: 64'ler
  lang: tur
  roots: [data/sources/64ler/rar, data/sources/64ler/nas]
  number: ['(?:64ler[ _-]+(?:sayi|sayu|sayı)?[ _-]*|64''ler sayı|64ler - )0*(\d+)']
  supplements: {professional: '(?i)prof+es+ional', sega: '(?i)sega magazine'}
  dates: {first: [1988, 4]}

commodore-bilgisayar-magazin:
  name: Commodore Bilgisayar Magazin
  lang: tur
  roots: [data/sources/nas]
  number: ['(?i)^commodore_bilgisayar_magazin_sayi_+(\d+)']
  dates: {1: "1991-09"}

amiga-dunyasi:
  name: Amiga Dünyası
  lang: tur
  roots: ["data/sources/nas/Amiga Dunyasi", "data/sources/nas/Amiga Dunyasi Jpegler"]
  # The PDFs are ABBYY FineReader rebuilds in Word (retyped text, cut-out pictures).
  remakes: '(?i)^amiga_dunyasi_\d+(_eski)?\.pdf$'
  number:
    - '(?i)^amiga[ _]dunyasi(?:[ _]dergisi-sayi)?[ _]0*(\d+)'
    - '(?i)^amiga[_ ](?:dergis_)?say_+0*(\d+)'
  dates: {first: [1990, 6]}
  # data/sources/ia/dergi-amiga-dunyasi (archive.org, Oct 2026) holds page images of the same remakes,
  # not scans: 21, 27, 28 and 29 match the PDFs page for page. 12's has the second Amiga BASIC page
  # pair (magazine pages 47-48) that our PDF lacks.
  inserts:
    12: [{after: 35, from: data/sources/ia/dergi-amiga-dunyasi/Amiga-Dunyasi-012-1991.cbr, pages: [36, 37]}]
    # Opal Vision (magazine pages 10-11), the end of Civilisation and the Arnie review.
    28: [{after: 8, from: data/sources/ia/dergi-amiga-dunyasi/Amiga-Dunyasi-028-1992.cbr, pages: [9, 10]},
         {after: 80, from: data/sources/ia/dergi-amiga-dunyasi/Amiga-Dunyasi-028-1992.cbr, pages: [79, 80]}]
  # 28's JPEGs ("Amiga Dunyasi Jpegler/Amiga Dunyasi 28") were scanned sideways, every page a quarter
  # turn anticlockwise. Its best/ PDF was rebuilt on 2026-10-30 from its own image streams, each
  # placed turned 90° clockwise (no re-encoding); a --build from the JPEGs would bring the fault back.
  # The inserts above were added to that PDF by hand on 2026-10-31 (insert_pages' method).

amiga-dergisi:
  name: Amiga Dergisi
  lang: tur
  # ia: 6-9 from archive.org/details/dergi-amiga-dergisi (Oct 2026); we had only a short 8 (51 of 84 pages).
  roots: [data/sources/nas/Amiga, data/sources/ia/dergi-amiga-dergisi]
  number: ['(?i)^amiga[ _](?:dergisi[ _](?:say_+)?)?(?:say_+)?0*(\d+)', '(?i)^amiga-dergisi-0*(\d+)-']
  turn_odd: '(?i)^amiga-dergisi-\d+-.*\.cbr$'
  # 2 = Mart 1993 and 8 = Ekim 1993 from the covers; 6 (Temmuz-Ağustos), 7 and 9 from the archive.org names.
  dates: {1: "1993-02", 2: "1993-03", 3: "1993-04", 4: "1993-05", 5: "1993-06", 6: "1993-07", 7: "1993-09", 8: "1993-10", 9: "1993-11", 10: "1993-12", 11: "1994-02", 12: "1994-03"}
  # amiga_dergisi_demo.pdf (a promotional issue) goes in as-is: see extras_root.
  extras_root: data/sources/nas
  extras: '(?i)^amiga_dergisi_demo\.pdf$'

megamiga:
  name: MegAmiga
  lang: tur
  # ia: 2 from archive.org/details/megamiga (Oct 2026), one page more than the NAS copies.
  roots: [data/sources/nas/MegAmiga, data/sources/ia/megamiga]
  number:
    - '(?i)say_+305_+0*(\d+)'
    - '(?i)^meg[-_ ]?amiga[-_ ]+(?:sayi_)?s?0*(\d+)'
    - '(?i)^meg(\d+)'
  dates: {first: [1995, 6], first_number: 0}

commodore-amiga:
  name: Commodore Amiga
  lang: tur
  # All 9 issues (Jan–Sep 1992) from archive.org/details/commodore-amiga (Oct 2026).
  roots: [data/sources/ia/commodore-amiga]
  number: ['(?i)^commodore-amiga-0*(\d+)-']
  dates: {first: [1992, 1]}

amiga-show:
  name: Amiga Show
  lang: tur
  roots: [data/sources/nas]
  number: ['(?i)^amiga_show_(\d+)_']
  dates: {1: "1996-09", 2: "1996-10"}

amigalife:
  name: AmigaLife
  lang: tur
  roots: [data/sources/nas]
  number: ['(?i)^amigalife_sayi0*(\d+)']

c64-turkiye:
  name: C64 Türkiye
  lang: tur
  roots: ["data/sources/c64-turkiye/C64 Türkiye", data/sources/nas/c64tr]
  number: ['(?i)^(?:c64 türkiye - |c64tr_)0*(\d+)']
  dates: {1: "2002-11", 2: "2003-03", 3: "2003-09", 4: "2004-02", 5: "2004-07", 6: "2004-11", 7: "2005-01", 8: "2005-10"}

palladium:
  name: Palladium
  lang: tur
  roots: [data/sources/nas/palladium]
  extras: '(?i)\.d64$'
  number: ['(?i)^palladium_0*(\d+)']

egitimde-bilgisayar:
  name: Eğitimde Bilgisayar
  lang: tur
  # Eğitimde bilgisayar.rar (Downloads, Oct 2026); not on the NAS.
  roots: ["data/sources/egitimde-bilgisayar/Eğitimde bilgisayar"]
  number: ['(?i)^e\S{1,3}itimde bilgisayar - 0*(\d+)']
  dates: {first: [1985, 3], first_number: 6}

matematik-dunyasi:
  name: Matematik Dünyası
  lang: tur
  # nas: 1991–92 from the NAS; web: 1993–2002 from https://www.matematikdunyasi.org/pdf-arsiv/
  # (YYYY-N.pdf, numbered on from 11 in date order; their archive has no 1997 and only some 1993/95/99).
  roots: [data/sources/matematik-dunyasi/nas, data/sources/matematik-dunyasi/web]
  # 1991_2 stores the opening page of "Gerçel Sayı Nedir?" as six horizontal strips: stack them back.
  join_strips: true
  number: ['^(199\d_\d(?:_I+)?)\.pdf$', '^(\d{4}-\d)\.pdf$']
  # 1992_5_I is really 1991 issue 5 (same articles as matematikdunyasi.org 1991-5); 1992_5_II is 1992-5.
  numbers: {"1991_1": 1, "1991_2": 2, "1991_3": 3, "1991_4": 4, "1992_5_I": 5, "1992_1": 6, "1992_2": 7, "1992_3": 8, "1992_4": 9, "1992_5_II": 10,
            "1993-1": 11, "1994-1": 12, "1994-2": 13, "1994-3": 14, "1994-4": 15, "1994-5": 16, "1995-1": 17, "1995-2": 18, "1995-3": 19, "1996-1": 20, "1996-2": 21, "1996-3": 22, "1996-4": 23, "1996-5": 24, "1998-1": 25, "1998-2": 26, "1998-3": 27, "1998-4": 28, "1998-5": 29, "1999-5": 30, "2000-1": 31, "2000-2": 32, "2000-3": 33, "2000-4": 34, "2000-5": 35, "2001-1": 36, "2001-2": 37, "2001-3": 38, "2001-4": 39, "2001-5": 40, "2002-1": 41, "2002-2": 42, "2002-3": 43, "2002-4": 44, "2002-5": 45}
  dates: {1: "1991", 2: "1991", 3: "1991", 4: "1991", 5: "1991", 6: "1992", 7: "1992", 8: "1992", 9: "1992", 10: "1992",
          11: "1993", 12: "1994", 13: "1994", 14: "1994", 15: "1994", 16: "1994", 17: "1995", 18: "1995", 19: "1995", 20: "1996", 21: "1996", 22: "1996", 23: "1996", 24: "1996", 25: "1998", 26: "1998", 27: "1998", 28: "1998", 29: "1998", 30: "1999", 31: "2000", 32: "2000", 33: "2000", 34: "2000", 35: "2000", 36: "2001", 37: "2001", 38: "2001", 39: "2001", 40: "2001", 41: "2002", 42: "2002", 43: "2002", 44: "2002", 45: "2002"}

laneth:
  name: Laneth
  lang: tur
  # All 31 issues (26-27 is one double issue, keyed 26) from https://lanethdergisi.com/, single
  # pages. The NAS folders (TAMG scans of 1-9, watermarked spreads ~600 px a page) are not used.
  roots: [data/sources/laneth/web]
  number: ['^Laneth0*(\d+)(?:-\d+)?$']
  # Monthly from May 1991 through 28 (Aug 93; 26-27 = Jun-Jul 93). 29 has no date: its editorial
  # looks back on '93. 30 and 31 are dated on their covers.
  dates: {first: [1991, 5], 29: "1993", 30: "1994-07", 31: "1994-10"}

